name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr la suite antes de publicar
        run: |
          pip install -e ".[crypto,mcp,dev]"
          pytest backend/tests -q

      - name: Armar el paquete (sdist + wheel)
        run: |
          pip install build
          python -m build

      - name: Publicar release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un tag con sufijo (v0.2.0-beta.1, v0.2.0-rc.1) es un pre-release:
          # se corta desde develop para probar features en curso, sin tocar
          # lo que instala quien pinea una versión estable.
          flags=()
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "${flags[@]}"
